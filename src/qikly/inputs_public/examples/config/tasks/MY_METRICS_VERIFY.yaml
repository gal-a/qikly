# Generated by `qikly scaffold`, with the two sections it leaves to you
# written in. That is the only difference between this and what the
# command writes for your own module.
task_id: "MY_METRICS_VERIFY"

task_name: "MY_METRICS_VERIFY: per-station daily temperature and humidity metrics from raw sensor CSVs"

description: "Reads sensor readings from one or more CSVs, decides which of them are usable, and writes one record per station per calendar day holding that day's temperature and humidity metrics."

inputs:
  - "inputs_private/data/MY_METRICS/input_01.csv"
  - "inputs_private/data/MY_METRICS/input_02.csv"

outputs:
  - "outputs/data/MY_METRICS_VERIFY/output.json"

# Read out of my_metrics.py. Scaffold guesses the entrypoint from the
# function names and marks the guess for checking, and each signature
# arrives with a `TODO` describing what it does. Both were checked here,
# which is why neither mark is still in the file.
interface:
  module: "outputs.agent_src.code.MY_METRICS_VERIFY.my_metrics"
  integration_functions:
    - "extract(input_path)  # reads one CSV and returns its rows, every value still a string"
    - "transform(rows)  # applies the rules below and returns one record per station per day"
    - "load(data, output_path)  # writes the records to output_path as JSON"
    - "run_metrics(input_paths, output_path)  # extracts each path, transforms the rows once, loads the result"
  system_entrypoint: "run_metrics(input_paths, output_path)"

# The decisions: what the code must do, in the words a person would use,
# including any choice that could have gone another way, such as a threshold, a
# unit or an exemption. The coding agent sees this section.
requirements:
  - "Read every CSV named in inputs and produce one record per station per
    calendar day, the day taken from the UTC date in reading_ts"
  - "A temperature is usable when temp_c reads as a number. There is no
    plausible range to enforce: a temperature is a measurement, and cold
    and hot are both real"
  - "A humidity is usable when humidity_pct reads as a number from 0 to 100
    inclusive, since it is a percentage of saturation"
  - "Temperature and humidity are judged one at a time, so an unusable
    humidity does not discard the temperature standing next to it in the
    same row"
  - "A row whose reading_ts is not a valid timestamp belongs to no day, so
    it is dropped whole"
  - "Each record reports the minimum, maximum and mean temperature in
    Celsius and the mean humidity as a percentage, each mean rounded to
    one decimal place, half away from zero"
  - "A station and day with no usable temperature still appears, with its
    three temperature fields null, and the same for humidity"
  - "Write the records to the output path as JSON, ordered by station_id
    and then by day"

# The consequences: what must be true if those decisions are implemented
# correctly, each naming its boundary value. The coding agent NEVER sees this
# section; test generation sees it in full, and that asymmetry is the whole
# point. Deriving these from the code would defeat it, so they are left for you.
#
# Write "rejects 0 and accepts 1" rather than "must be positive": the first
# forces a test at the boundary, the second invites a test at 5. Every one
# below names a value that some row in the sample data actually reaches.
acceptance_criteria:
  - "A humidity_pct of 100 is usable and one of 101 is not"
  - "A temp_c of 0.0 is a measurement rather than a missing value, so a
    station whose only usable reading that day is 0.0 reports a minimum of
    0.0 rather than no temperature at all"
  - "A day whose usable temperatures are 4.5 and 11.2 reports a mean of
    7.9, because 7.85 rounds away from zero"
  - "A negative temperature is usable: a day holding -1.0 and 3.8 reports a
    minimum of -1.0 rather than dropping the reading"
  - "A station whose temperatures are all unusable on a day still appears
    for that day, with minimum, maximum and mean temperature null and its
    mean humidity present"
  - "A row whose reading_ts is not a valid timestamp contributes to no
    record, so a station with three rows for a day, one of them carrying a
    malformed timestamp, reports metrics over the other two"

# The code you already have is the thing under test. The suite is still written
# from your acceptance_criteria by an agent that never reads this file, so a
# failure here is a finding about the code rather than a test written to fit it.
#
# What this cannot tell you is what the author of that code saw. Withholding is
# a property of a run qikly performed, not of a file you supply: if the code
# was written with these criteria open, the suite is still independent of the
# code, but the author was not.
#
# What a run can do is ask git. If this task file was last changed before the
# implementation's first commit, the criteria were not written against code
# that was already in the repository, and the run says so as it starts and in
# its report. Read that narrowly, because it is a narrow claim: code can have
# existed uncommitted while the criteria were being written, and criteria
# committed first say nothing about whether the code's author read them, which
# no ordering of commits can show. So the run prints those bounds alongside the
# verdict, and reports whether the two sides were committed by the same person.
seed:
  implementation: "my_metrics.py"
