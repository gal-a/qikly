# Short, filesystem-safe identifier (letters/digits/underscore only, must not
# start with a digit). Must match this file's own name (inputs/config/tasks/<task_id>.yaml).
# Namespaces this task's own inputs_private/data/<task_id>/, outputs/data/<task_id>/,
# outputs/tests/<task_id>/, and outputs/agent_src/code/<task_id>/ -- so any
# number of V&V tasks can run in this same project, including concurrently
# in separate processes, without their files colliding.
task_id: "CALC_DISCOUNT"

task_name: "CALC - Order Discount"

description: "Implement a simple pipeline that reads two CSV files of order discount requests, validates them, computes the discount amount and final total for each valid row, and writes the result to a single JSON output alongside an explanation for every row that was rejected."

inputs:
  - "inputs_private/data/CALC_DISCOUNT/input_01.csv"
  - "inputs_private/data/CALC_DISCOUNT/input_02.csv"

outputs:
  - "outputs/data/CALC_DISCOUNT/output.json"

# Describes the implementation's expected shape so test generation can target
# it without the prompts hardcoding any task-specific function names. Written
# once per task; integration/system test generation reads this section
# directly out of this file's text.
interface:
  module: "outputs.agent_src.code.CALC_DISCOUNT.calc"
  integration_functions:
    - "extract(input_path) -> list[dict]  # reads one input file, returns its raw rows"
    - "transform(rows) -> dict  # validates each row and computes the discount amount and final total for valid ones; returns {\"accepted\": [...], \"rejected\": [...]}, where each accepted entry includes the computed discount_amount and final_total, and each rejected entry is the original row plus a \"reason\" field"
    - "load(data, output_path) -> None  # writes the {\"accepted\": [...], \"rejected\": [...]} result to the output file as JSON"
  system_entrypoint: "run_calc(input_paths, output_path) -> None  # runs extract on each path in input_paths (a list), combines the raw rows, then transform -> load end-to-end"

requirements:
  - "Read both CSV files listed in this task's inputs (inputs_private/data/CALC_DISCOUNT/input_01.csv and inputs_private/data/CALC_DISCOUNT/input_02.csv), and combine their rows into a single list before validation"
  - "Validate each row: order_id (string), subtotal (a dollar amount), discount_type (either \"percent\" or \"flat\"), discount_value (a number)"
  - "Apply reasonable, strict real-world data-quality validation to subtotal, discount_type, and discount_value -- reject anything malformed, implausible, or out of range"
  - "For each valid row, compute the discount amount and the final total after applying the discount to the subtotal, both as currency amounts rounded to the nearest cent"
  - "A row that fails validation is not included among the accepted rows -- but is not silently dropped either: record the original row alongside a brief, specific reason it was rejected"
  - "Write the result to outputs/data/CALC_DISCOUNT/output.json as a single JSON object with two keys: \"accepted\" (the list of valid rows, each with its computed discount_amount and final_total) and \"rejected\" (a list of objects, each the original row plus a \"reason\" field)"

acceptance_criteria:
  - "All valid rows appear in the output JSON's \"accepted\" list, and only valid rows appear there"
  - "Invalid or malformed rows are excluded from \"accepted\" and instead appear in \"rejected\", each with a reason"
  - "Output JSON is a single object with \"accepted\" and \"rejected\" keys, each a list of objects"
  - "Each rejected row's reason names the specific field that caused rejection (e.g. \"subtotal\", \"discount_type\", \"discount_value\") rather than a generic message like \"invalid row\""
  - "subtotal is only valid if it is a positive number (greater than zero) -- zero, negative, non-numeric, or missing values are invalid"
  - "discount_type is only valid if it is exactly \"percent\" or \"flat\", matched case-insensitively -- any other value is invalid"
  - "For discount_type \"percent\", discount_value is only valid if it is a number from 0 to 100 inclusive -- a negative value or a value over 100 is invalid, since a discount of more than 100% of the price is nonsensical"
  - "For discount_type \"flat\", discount_value is only valid if it is a non-negative number -- a negative flat discount is invalid"
  - "A discount_value of exactly 0 is valid for either type: it applies no discount, so discount_amount is 0.00 and final_total equals subtotal exactly"
  - "A \"flat\" discount_value that is greater than the row's subtotal is still valid, but the discount actually applied must be capped at the subtotal, so final_total never goes below 0.00 -- the discount_amount actually applied never exceeds the subtotal"
  - "All computed currency amounts (discount_amount, final_total) are rounded to exactly two decimal places using round-half-up -- a value exactly halfway between two cents rounds UP (e.g. a computed discount of 4.125 rounds to 4.13), not Python's default round-half-to-even banker's rounding, and not truncation"
  - "Computed currency amounts must be exact to the cent regardless of binary floating-point representation error"
  - "For every accepted row, final_total is exactly equal to subtotal minus discount_amount, to the cent"
