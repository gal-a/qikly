orchestrator:
  max_retries_per_stage: 10
  test_order:
    - "integration"
    - "system"
    - "unit"

agent:
  max_patch_size: 8000  # characters; an oversized PATCH is rejected and the agent is asked to retry smaller.
    # Bootstrap (whole-file creation) and multi-rule fixes for the ETL task's
    # generated code observed real sizes of 2000-3400 chars even when correct --
    # 2000 was untested and too tight: it made the agent visibly mangle diffs
    # trying to fit, which then failed to apply. Retune per task if a larger
    # or smaller implementation pushes past this.

  # How much of a failure the coding agent is shown: full | staged
  #
  # full (default) hands over pytest's default traceback. That includes the
  # failing test's own source from `def` down to the failing line, and its
  # docstring, which in a generated suite usually paraphrases the acceptance
  # criterion the test came from. The criteria themselves are never in the
  # prompt, but assume a failing test gives its own criterion away.
  #
  # staged starts at pytest's `line` traceback, which gives the file, the line
  # and the error with no test source and no docstring, and adds detail only
  # after a patch has applied cleanly and left the failure unchanged. Two such
  # attempts in a row and it reaches the full traceback, so staged can cost
  # extra iterations but cannot strand a run on too little information.
  # Frames inside your implementation are printed at every rung.
  #
  # Scope: staged narrows ordinary stage failures only. The bootstrap attempt
  # against an empty source tree, and the regression re-checks that re-run
  # earlier stages, always use the full traceback. Both are the ceiling rather
  # than something above it, so nothing widens, but staged does not narrow
  # them.
  #
  # Leave this alone unless you are experimenting. It is off by default for
  # one reason: every convergence figure this project publishes was measured
  # under full, and what staged does to convergence has not been measured. A
  # ten-run comparison could not tell a small difference from noise, so the
  # honest position is that the effect is unknown rather than neutral.
  diagnostic_feedback: full

  # Show the coding agent the `# Criteria: 2` and `# Requirements: 2, 4`
  # markers that test generation writes into each test's docstring.
  #
  # Off, and the opposite default to diagnostic_feedback above, for the
  # opposite reason. Withholding a docstring is a real trade, so it stays off
  # until somebody measures it. Withholding a criterion's number trades
  # nothing: the number is not a rule and no repair turns on one. What it does
  # say is how many criteria exist and which one a failing test came from,
  # which over several iterations maps out the bar the agent is judged against.
  #
  # The suite on disk keeps its markers either way, so `qikly.traceability`
  # and the coverage report are unaffected. Only the agent's copy loses them.
  traceability_markers_visible: false

logging:
  save_transactions: true

# Run summaries (outputs/reports/run_summary/*.json) have no settings: they are
# written after every run, like the HTML reports, and stay on your disk.

# Which model each of the four agents runs on.
#
# Everything falls back to `default`, and `default` falls back to the
# LLM_PROVIDER / LLM_MODEL environment variables, so leaving this untouched
# keeps the single-model behaviour. An exported LLM_PROVIDER or LLM_MODEL
# overrides this file, which is what makes a one-off run easy.
#
# provider: gemini | openai | anthropic
test_generation:
  # How many acceptance criteria one test-generation call is shown.
  #
  # 0 means one call carrying the whole bar. That is how every published
  # number in this project was measured, and it has a problem: the suite does
  # not grow when the bar does. Across 67 archived suites, refinement raised
  # the criteria count 54% while the generated suite got 6% smaller, so tests
  # per criterion fell from 2.21 to 1.32. One call appears to produce roughly
  # a fixed amount of test code however much it is asked to cover, which
  # spreads coverage thinner rather than adding any.
  #
  # A positive value splits the bar into batches and makes one call per batch,
  # writing one file per batch, so a longer bar costs more calls and produces
  # more tests. Left at 0 by default: turning it on changes the shape of every
  # run and invalidates comparison against the existing numbers, so it should
  # be a deliberate choice rather than a silent upgrade.
  criteria_per_batch: 0

  # Check the integration and system suites against the acceptance criteria
  # and against each other, after they are written and before any code is, and
  # write a suite once more when the check finds a test no correct
  # implementation could pass. One extra model call per run, more on a finding.
  #
  # Why it exists: the test-writing agent can misread a clear criterion. On a
  # following-distance task whose criterion said exactly 2.00 seconds of headway
  # raises no warning, seven of ten runs generated a test that warned at 2.00
  # anyway, and all seven failed.
  #
  # Why it is off: on the saved suites of those ten runs the check flagged all
  # seven, but a ten-run sweep with it on converged 4 times in 10 against 3
  # without, which is noise, and in one run a wrong finding led a correct suite
  # to be rewritten wrong. On a small model it reads `<` against `<=`
  # unreliably in both directions, and the rewrite inherits its mistakes. Turn it
  # on to try it, ideally with `agents.review` pointed at a stronger model.
  check_suites: false

agents:
  default:
    provider: gemini
    model: gemini-3.5-flash-lite

  # FIX and PATCH. Invoked far more often than the other three, so this is
  # where a cheap model pays for itself.
  code: {}

  # Test generation. `test` applies to all three stages; a stage's own entry
  # overrides it. Unit is the stage that stalls most often and the only one
  # that sees the implementation, so it is the one where a stronger model is
  # most likely to pay without raising the cost of the other two.
  test: {}
  test_integration: {}
  test_system: {}
  test_unit: {}

  # Drafts the acceptance criteria from the requirements.
  criteria: {}

  # Adversarially reviews the criteria against a finished implementation.
  # A stronger model here is the change most likely to be worth its cost,
  # since this is the agent asked to find what nobody wrote down.
  review: {}

  # Proposes fixture rows for criteria that no existing row can trigger.
  # Runs only when a refinement round asks it to, and only ever writes a
  # proposal file for a human to accept: it never edits your fixtures.
  fixtures: {}
