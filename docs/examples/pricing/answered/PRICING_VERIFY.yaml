# The task file for pricing.py. Answer the questions under
# acceptance_criteria, then run:  qikly --tasks pricing.py
task_id: "PRICING_VERIFY"
task_name: "PRICING_VERIFY: tests for pricing.py"
description: "Tests for the existing pricing.py, from its owner's answers."

# ----------------------------------------------------------------------------
# Your code under test. qikly copies it, tests the copy and repairs the copy;
# this file is never changed. Without this section a run would write new code
# from the requirements instead of testing yours.
seed:
  implementation: "pricing.py"

# ----------------------------------------------------------------------------
# The example data a run calls your code with, filled in from your tests, and
# where a run writes its result.
inputs:
  - "inputs_private/data/PRICING/input_01.csv"
outputs:
  - "outputs/data/PRICING_VERIFY/output.json"

# ----------------------------------------------------------------------------
# The functions the tests call, read from pricing.py. `module` is where
# qikly's copy of your code is imported from during a run. Nothing to change.
interface:
  module: "outputs.agent_src.code.PRICING_VERIFY.pricing"
  integration_functions:
    - "apply_discount(price, rate)"
    - "label(code)"
  system_entrypoint: "apply_discount(price, rate)"

# ----------------------------------------------------------------------------
# What the code is for, in your words. The coding agent reads this, so give
# its purpose, not the values the questions below ask about. Replace the
# line, keeping the quotes, for example:
#   - "reads sensor readings and writes one summary per station per day"
requirements:
  - "applies a percentage discount to a price, and labels customer codes"

# ----------------------------------------------------------------------------
# What must be true. The coding agent never sees this section; the test
# agent writes the tests from it. Replace each TODO line with your answer,
# keeping the quotes and naming a value someone could check, for example:
#   - "TODO: what example_fn(0) should do"  becomes  - "example_fn(0) returns 1.5"
# A TODO you leave is skipped. The question lines above each TODO are notes
# for you, and neither agent reads them. Keep these values out of every
# other line of this file, comments included: the coding agent reads the rest.
acceptance_criteria:
  #? 6 questions from qikly --score on 2026-10-18 14:03: what your tests do
  #? not check. Answer from what the code is meant to do, not from what it
  #? does now.

  #? pricing.py, apply_discount, line 2:
  #?     if rate < 0 or rate > 100:
  #? Your tests never try rate at exactly 0.
  #? What should apply_discount(100, 0) do?
  #? Found by running your code:
  #? - return a value, as rate 1 does now (it returns 99.0)
  #? - raise ValueError, as rate -1 does now
  - "apply_discount(100, 0) returns 100.0"

  #? pricing.py, apply_discount, line 2:
  #?     if rate < 0 or rate > 100:
  #? What should apply_discount(100, -11) do?
  #? Found by running your code:
  #? - raise ValueError, as your code does now
  #? - return 111.0
  #? (This also answers 2 more places your tests leave open on the same call.)
  - "apply_discount(100, -11) raises ValueError"

  #? pricing.py, apply_discount, line 2:
  #?     if rate < 0 or rate > 100:
  #? Your tests never try rate at exactly 100.
  #? What should apply_discount(100, 100) do?
  #? Found by running your code:
  #? - return a value, as rate 99 does now (it returns 1.0)
  #? - raise ValueError, as rate 101 does now
  - "apply_discount(100, 100) raises ValueError"

  #? pricing.py, apply_discount, line 4:
  #?     return round(price * (1 - rate / 100), 2)
  #? What should apply_discount(100, 10.333) do?
  #? Found by running your code:
  #? - return 89.667
  #? - return 89.67, as your code does now
  - "apply_discount(100, 10.333) returns 89.67"

  #? pricing.py, label, line 8:
  #?     if code.strip().lower() == "vip":
  #? What should label(' vip ') do?
  #? Found by running your code:
  #? - return 'gold', as your code does now
  #? - return 'standard'
  - "label(' vip ') returns 'gold'"

  #? pricing.py, label, line 8:
  #?     if code.strip().lower() == "vip":
  #? What should label('VIP') do?
  #? Found by running your code:
  #? - return 'gold', as your code does now
  #? - return 'standard'
  - "label('VIP') returns 'gold'"
