# The task file for shop/pricing.py. Answer the questions under
# acceptance_criteria, then run:  qikly --tasks shop/pricing.py
task_id: "PRICING_VERIFY"
task_name: "PRICING_VERIFY: tests for pricing.py"
description: "Tests for the existing pricing.py, from its owner's answers."

# ----------------------------------------------------------------------------
# Your code under test. qikly copies it, tests the copy and repairs the copy;
# this file is never changed. Without this section a run would write new code
# from the requirements instead of testing yours.
seed:
  implementation: "shop"

# ----------------------------------------------------------------------------
# Example data for the tests: one column per argument, one row per call,
# filled in from your tests. The test agent writes tests that use it, and
# `qikly --validate` warns about a criterion no row can reach. Add rows, or
# more files to the list (any format your code reads); every file listed
# must exist. `outputs` is where a run writes its result.
inputs:
  - "inputs_private/data/PRICING/input_01.csv"
outputs:
  - "outputs/data/PRICING_VERIFY/output.json"

# ----------------------------------------------------------------------------
# The functions the tests call, read from shop/pricing.py. `module` is where
# qikly's copy of your code is imported from during a run. Nothing to change.
interface:
  module: "shop.pricing"
  integration_functions:
    - "apply_discount(price, rate)"
  system_entrypoint: "apply_discount(price, rate)"

# ----------------------------------------------------------------------------
# What the code is for, in your words. The coding agent reads this, so give
# its purpose, not the values the questions below ask about. Replace the
# line, keeping the quotes, for example:
#   - "reads sensor readings and writes one summary per station per day"
