name: Task proposal
description: Propose a new example task before writing it
labels: ["task proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Users are encouraged to contribute their own tasks, so thank you for
        offering one. A few lines here stop two people writing the same task, and
        let us agree on the scope and the name before you spend time on fixtures.
        What a task needs, and the naming rules, are in CONTRIBUTING.md.

        Tasks from domains the thirteen bundled examples do not cover are the most
        useful: today they are calculations, clean-ups and merges on CSV, one
        log summary and three vehicle sensor tasks.
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: sensor data, finance, healthcare records, logistics
    validations:
      required: true
  - type: input
    id: task_id
    attributes:
      label: Proposed task id
      description: FAMILY_SUBJECT in upper case, at most 32 characters. It must not match an existing task in any case, and must not end in _VERIFY.
      placeholder: SENSOR_PROXIMITY
    validations:
      required: true
  - type: textarea
    id: module
    attributes:
      label: What the module does
      description: One self-contained Python module that reads input files and writes one output. A few sentences.
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: One acceptance criterion, as an example
      description: A consequence that names a value, such as "an order of exactly 100.00 receives a discount of 10.00".
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: Where the fixture data comes from
      description: Synthetic or openly licensed. It ships in the package under Apache 2.0, so no personal or company data.
      placeholder: synthetic, generated by a script I will include
    validations:
      required: true
